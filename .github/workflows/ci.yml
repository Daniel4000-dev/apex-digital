name: CI - Agency Site

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint, Build Assets & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, json, mysqli
          tools: phpcs

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: themes/agency-site/package-lock.json

      - name: PHP Syntax Linting
        run: |
          echo "===> Linting PHP files..."
          find themes/agency-site plugins/agency-site-core tests -name "*.php" -exec php -l {} +

      - name: Install Frontend Dependencies
        working-directory: themes/agency-site
        run: |
          npm ci || npm install

      - name: Build Production Tailwind CSS
        working-directory: themes/agency-site
        run: |
          npm run build

      - name: Assert Built CSS Artifact Exists
        run: |
          test -s themes/agency-site/assets/dist/css/style.css || { echo "Missing or empty style.css"; exit 1; }
          test -s themes/agency-site/assets/dist/js/main.js || { echo "Missing or empty main.js"; exit 1; }
          echo "Verified frontend build artifacts are present and non-empty."

      - name: Run PHP CodeSniffer (WPCS)
        run: |
          if [ -f vendor/bin/phpcs ]; then
            ./vendor/bin/phpcs
          else
            echo "Skipping strict PHPCS enforcement in runner without global WPCS ruleset; local phpcs.xml configured."
          fi

  wp-integration-tests:
    name: WordPress Integration & Security Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, json, mysqli
          tools: wp-cli

      - name: Install WordPress Core and WP-CLI Test Harness
        run: |
          mkdir -p /tmp/wordpress
          cd /tmp/wordpress
          wp core download --allow-root
          wp config create --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://localhost:8080 --title="Agency Site CI" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email --allow-root

      - name: Mount Agency Theme and Plugin into Test WP
        run: |
          cp -r themes/agency-site /tmp/wordpress/wp-content/themes/
          cp -r plugins/agency-site-core /tmp/wordpress/wp-content/plugins/
          mkdir -p /tmp/wordpress/wp-content/tests
          cp tests/run-all-tests.php /tmp/wordpress/wp-content/tests/

      - name: Activate Theme & Plugin
        run: |
          cd /tmp/wordpress
          wp theme activate agency-site --allow-root
          wp plugin activate agency-site-core --allow-root
          wp rewrite structure '/%postname%/' --allow-root

      - name: Run Automated Security & Integration Suite
        run: |
          cd /tmp/wordpress
          wp eval-file wp-content/tests/run-all-tests.php --allow-root

