name: CI - Apex Digital

on:
  push:
    branches: [ main, master, 'review/*' ]
  pull_request:
    branches: [ main, master, 'review/*' ]

jobs:
  lint-and-build:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, json, mysqli
          tools: phpcs

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PHP Syntax Check
        run: |
          find themes/agency-site plugins/agency-site-core tests -name node_modules -prune -o -name vendor -prune -o -name "*.php" -exec php -l {} +

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist

      - name: PHP CodeSniffer (WordPress Coding Standards - Strict)
        run: |
          vendor/bin/phpcs --standard=phpcs.xml

      - name: Install Frontend Dependencies
        working-directory: themes/agency-site
        run: |
          npm ci --legacy-peer-deps

      - name: JavaScript Source Lint
        working-directory: themes/agency-site
        run: |
          npm run lint:js

      - name: Build Production Tailwind CSS
        working-directory: themes/agency-site
        run: |
          npm run build

      - name: Assert Built Production Assets
        run: |
          test -s themes/agency-site/assets/dist/css/style.css || { echo "Missing style.css"; exit 1; }
          test -s themes/agency-site/assets/dist/js/main.js || { echo "Missing main.js"; exit 1; }

      - name: Install & Build Legacy Maintenance Fixture
        working-directory: legacy-maintenance-example
        run: |
          npm ci --legacy-peer-deps
          npm run build
          test -s dist/css/main.css || { echo "Missing legacy main.css"; exit 1; }
          test -s dist/audit-component.html || { echo "Missing legacy audit-component.html"; exit 1; }

  wp-integration-tests:
    name: WordPress Integration, Security & Behavioural Suite
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, json, mysqli
          tools: wp-cli

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist

      - name: Install WordPress Core and Test Harness
        run: |
          mkdir -p /tmp/wordpress
          cd /tmp/wordpress
          wp core download --allow-root
          wp config create --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://127.0.0.1:8080 --title="Apex Digital CI" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email --allow-root

      - name: Mount Agency Theme and Plugin into Test WP
        run: |
          cp -r themes/agency-site /tmp/wordpress/wp-content/themes/
          cp -r plugins/agency-site-core /tmp/wordpress/wp-content/plugins/
          mkdir -p /tmp/wordpress/wp-content/tests
          cp tests/run-all-tests.php /tmp/wordpress/wp-content/tests/

      - name: Activate Theme & Companion Plugin
        run: |
          cd /tmp/wordpress
          wp theme activate agency-site --allow-root
          wp plugin activate agency-site-core --allow-root
          wp rewrite structure '/%postname%/' --allow-root

      - name: Run PHPUnit Unit & Integration Suite
        env:
          WP_ROOT: /tmp/wordpress
        run: |
          vendor/bin/phpunit

      - name: Run Behavioural, Security & Ingress Suite (52 Assertions)
        run: |
          cd /tmp/wordpress
          wp eval-file wp-content/tests/run-all-tests.php --allow-root
